name: Deploy to cPanel

on:
  push:
    branches: [main]

# Deployment is handled via a GitHub Webhook pointing to cPanel's Git Version Control.
# This workflow exists as a placeholder. No Actions runner is needed.
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment triggered via GitHub Webhook
        run: echo "Push received. cPanel webhook handles deployment automatically."
