name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code from GitHub
        run: |
          RESPONSE=$(curl -sf -X POST "https://wonderweb.host:2083/execute/VersionControl/update" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository=/home/righteou/REA_AFRICA")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":1' || (echo "ERROR: update failed" && exit 1)

      - name: Deploy HEAD Commit
        run: |
          RESPONSE=$(curl -sf -X POST "https://wonderweb.host:2083/execute/VersionControl/create_deploy" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository=/home/righteou/REA_AFRICA")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":1' || (echo "ERROR: deploy failed" && exit 1)

      - name: Restart Node.js App
        run: |
          RESPONSE=$(curl -sf -X POST "https://wonderweb.host:2083/execute/NodeJS/restart_app" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "app_root=REA_AFRICA")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":1' || (echo "ERROR: restart failed" && exit 1)
