name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code from GitHub
        run: |
          curl -s -X POST "https://wonderweb.host:2083/execute/VersionControl/update" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository=/home/righteou/REA_AFRICA"

      - name: Deploy HEAD Commit
        run: |
          curl -s -X POST "https://wonderweb.host:2083/execute/VersionControl/create_deploy" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository=/home/righteou/REA_AFRICA"
