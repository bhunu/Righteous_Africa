name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code on cPanel
        run: |
          curl -s --max-time 30 -X POST \
            "https://wonderweb.host:2083/execute/VersionControl/update" \
            -H "Authorization: cpanel righteou:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository=/home/righteou/REA_AFRICA" \
            | tee /tmp/update.json
          grep -q '"status":1' /tmp/update.json || { echo "Update failed:"; cat /tmp/update.json; exit 1; }

      - name: Run deployment tasks (.cpanel.yml)
        run: |
          curl -s --max-time 120 -X POST \
            "https://wonderweb.host:2083/execute/VersionControl/create_deploy" \
            -H "Authorization: cpanel righteou:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository=/home/righteou/REA_AFRICA" \
            | tee /tmp/deploy.json
          grep -q '"status":1' /tmp/deploy.json || { echo "Deploy failed:"; cat /tmp/deploy.json; exit 1; }

      - name: Restart Node.js app
        run: |
          curl -s --max-time 30 -X POST \
            "https://wonderweb.host:2083/execute/NodeJS/restart_app" \
            -H "Authorization: cpanel righteou:${{ secrets.CPANEL_TOKEN }}" \
            -d "app_root=REA_AFRICA" \
            | tee /tmp/restart.json
          grep -q '"status":1' /tmp/restart.json || { echo "Restart failed:"; cat /tmp/restart.json; exit 1; }
